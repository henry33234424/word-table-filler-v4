name: Build Windows v5

on:
  workflow_dispatch:
  push:
    branches:
      - v5-namespace-wrapper

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dependency graph
        run: |
          python -m pip check

      - name: Smoke test app imports
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '_internal')
          import src.app
          import src.ui.step1_files
          import src.ui.step2_rules
          import src.ui.step3_mapping
          import src.ui.step4_execute
          import src.core.word_parser
          import src.core.mapping
          import src.core.filler
          import src.core.word_exporter
          PY
        shell: bash

      - name: Smoke test XML namespace roundtrip
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          from lxml import etree as ET

          sys.path.insert(0, '_internal')
          from src.core.word_parser import (
              capture_xml_wrapper,
              register_namespaces_from_file,
              write_xml_preserving_wrapper,
          )

          xml = """<?xml version="1.0" encoding="UTF-8"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><x:foo xmlns:x="urn:test"/></w:body></w:document>"""

          tmp = Path(tempfile.mkdtemp())
          src = tmp / "in.xml"
          out = tmp / "out.xml"
          src.write_text(xml, encoding="utf-8")

          xml_decl, root_start, root_end = capture_xml_wrapper(src)
          register_namespaces_from_file(src)
          root = ET.parse(str(src)).getroot()
          write_xml_preserving_wrapper(root, out, xml_decl, root_start, root_end)
          ET.parse(str(out))

          assert 'xmlns:x="urn:test"' in out.read_text(encoding="utf-8")
          PY
        shell: bash

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller ^
            --name "Word表格模板填报工具" ^
            --windowed ^
            --noconfirm ^
            --clean ^
            --paths "_internal" ^
            --hidden-import customtkinter ^
            --hidden-import tksheet ^
            --hidden-import lxml.etree ^
            --hidden-import pandas ^
            --hidden-import openpyxl ^
            --hidden-import numpy ^
            --collect-all customtkinter ^
            --collect-all tksheet ^
            --collect-all lxml ^
            --collect-all openpyxl ^
            --add-data "_internal/src;src" ^
            _internal/src/main.py
        shell: cmd

      - name: Package artifact
        run: |
          $packageRoot = "package"
          $artifactName = "Excel-to-Word表格模板填报工具-Windows-v5"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Move-Item -Path "dist/Word表格模板填报工具" -Destination "$packageRoot/$artifactName"
          Copy-Item -Path "使用说明.docx" -Destination "$packageRoot/$artifactName/" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel-to-Word表格模板填报工具-Windows-v5
          path: package/Excel-to-Word表格模板填报工具-Windows-v5
          retention-days: 30
